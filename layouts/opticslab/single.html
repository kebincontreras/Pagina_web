{{ define "main" }}
<link rel="stylesheet" href="/optics-lab/lab.css?v=6">
<main class="optics-lab container" data-lang="{{ .Language.Lang }}">
  <section id="catalog">
    <div class="lab-intro"><p class="lab-kicker" data-t="collection"></p><h1>{{ .Title }}</h1><p class="lab-lede" data-t="intro"></p></div>
    <div class="lab-cards" id="cards"></div>
  </section>
  <section id="simulator" hidden>
    <a class="lab-back" href="./" data-t="back"></a>
    <div class="lab-intro lab-compact"><p class="lab-kicker" data-t="basic"></p><h1 data-t="seidel"></h1><p class="lab-lede" data-t="desc"></p></div>
    <div class="lab-workspace">
      <aside class="lab-panel">
        <p class="lab-panel-title" data-t="parameters"></p>
        <label class="check lab-preset"><input id="coma-example" type="checkbox"><span data-t="comaExample"></span></label>
        <form id="controls" novalidate></form>
        <div class="lab-actions"><button type="button" id="reset" class="lab-secondary" data-t="reset"></button></div>
        <p id="error" role="alert" hidden></p>
      </aside>
      <div class="lab-view">
        <div class="lab-charts">
          <figure class="lab-rays"><figcaption data-t="raytitle"></figcaption><svg id="rayplot" viewBox="0 0 610 340" role="img"></svg></figure>
          <figure class="lab-coeffs"><figcaption data-t="bartitle"></figcaption><svg id="bars" viewBox="0 0 445 300" role="img"></svg><div id="detail"></div></figure>
        </div>
        <div class="lab-psf-heading"><h2 data-t="gallery"></h2><p data-t="galleryNote"></p></div>
        <div id="psfs" class="lab-psfs" aria-live="polite"></div>
      </div>
    </div>
    <p class="lab-note" data-t="note"></p>
  </section>
</main>
<script type="module" src="/optics-lab/lab.js?v=8"></script>
{{ end }}
